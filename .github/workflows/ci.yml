name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run unit tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Run deterministic policy invariant batch
        run: npm run simulate:ci --silent > simulation-ci.json 2> simulation-ci.stderr

      - name: Run short Chromium browser suite
        run: npm run test:e2e:short

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-ci-report
          path: |
            simulation-ci.json
            simulation-ci.stderr
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
